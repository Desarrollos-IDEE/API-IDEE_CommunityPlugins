module.exports = "<div class=\"m-geosearch-content\">\n   {{#each features}}\n   <div id=\"{{solrid}}\" class=\"result\">\n      {{#each attributes}}\n      <table>\n         <tr>\n            <td class=\"key\">{{key}}</td>\n            <td class=\"value{{#oneword value}} m-wordbreak{{/oneword}}\">{{{value}}}</td>\n         </tr>\n      </table>\n      {{/each}}\n   </div>\n   <div class=\"m-separator\"></div>\n   {{/each}}\n</div>";
