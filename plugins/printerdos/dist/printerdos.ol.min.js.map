module.exports = "<div class=\"m-control m-printer-container\">\n    <!-- TITLE -->\n    <div class=\"m-printer-title\">Impresión del mapa</div>\n    <!-- FORM -->\n    <div class=\"form\">\n        <!-- title -->\n        <div class=\"title\">\n            <input type=\"text\" placeholder=\"Título\">\n        </div>\n        <!-- description -->\n        <div class=\"description\">\n            <textarea placeholder=\"Descripción\"></textarea>\n        </div>\n        <!-- layout -->\n        <div class=\"layout\">\n            <label>Plantilla </label>\n            <select>\n                {{#each layouts}}\n                    <option value=\"{{name}}\" {{#if default}} selected{{/if}}>{{name}}</option>\n                {{/each}}\n            </select>\n        </div>\n        <!-- DPI -->\n        <div class=\"dpi\">\n            <label>DPI </label>\n            <select>\n                {{#each dpis}}\n                    <option value=\"{{value}}\" {{#if default}} selected{{/if}}>{{value}}</option>\n                {{/each}}\n            </select>\n        </div>\n        <!-- format -->\n        <div class=\"format\">\n            <label>Formato </label>\n            <select>\n                {{#each format}}\n                    <option value=\"{{name}}\" {{#if default}} selected{{/if}}>{{name}}</option>\n                {{/each}}\n            </select>\n        </div>\n        <!-- force scale -->\n        <div class=\"forcescale\">\n            <label>Forzar escala </label>\n            <input type=\"checkbox\" {{#if forceScale}} checked{{/if}}>\n        </div>\n        <!-- text wrap -->\n        <div class=\"textwrap\">\n            <label>% Ajuste texto</label>\n            <input id='inputRange' type=\"range\" min=\"0\" max=\"1\" step=\"0.1\" value={{textWrap}}>\n            <div id='label'>{{textWrap}}</div>\n        </div>\n    </div>\n    <!-- buttons -->\n    <div class=\"button\">\n        <button class=\"print\"><i class=\"g-cartografia-impresora\"></i> Imprimir</button>\n        <button class=\"remove\"><i class=\"g-cartografia-papelera\"></i> Borrar</button>\n        <button class=\"cancel\"><i class=\"g-cartografia-cancelar\"></i> Cancelar impresión</button>\n    </div>\n    <!-- queue -->\n    <div class=\"queue\">\n        <div class=\"title\">Descargar</div>\n        <ul class=\"queue-container\"></ul>\n    </div>\n    <!-- minimize button -->\n    <div class=\"minimize\" title=\"Minimizar el control de impresión\"></div>\n</div>";
