module.exports = "<div class=\"m-geosearch-help\">\n  {{#eq entities.length 0}}\n    <div class=\"entity\">\n      <p>El servicio no tiene ayuda configurada</p>\n      <button id=\"m-geosearch-closeHelp-btn\" class=\"g-cartografia-cancelar\" title=\"Cerrar ayuda\"></button>\n    </div>\n  {{/eq}}\n  {{#each entities}}\n    <div class=\"entity\">\n      <button id=\"m-geosearch-closeHelp-btn\" class=\"g-cartografia-cancelar m-clear-btn\" title=\"Cerrar ayuda\"></button>\n      <div class=\"name\">{{entity}}</div>\n      <div class=\"info\">{{info}}</div>\n      <ul class=\"keywords\">\n        {{#each keywords}}\n          <li>{{this}}</li>\n        {{/each}}\n      </ul>\n      <div class=\"example\">\n        <code>{{example}}</code>\n      </div>\n    </div>\n  {{/each}}\n</div>";
