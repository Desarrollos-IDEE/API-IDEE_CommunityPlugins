module.exports = "<div class=\"m-geosearchbylocation-results-panel\">\n   <div class=\"title\">\n           B&uacute;squeda por localizaci&oacute;n\n            <button class=\"m-panel-btn\"></button>\n    </div>\n   <div class=\"results\" id=\"m-geosearchbylocation-results-scroll\">\n      {{#each docs}}\n      <div id=\"{{solrid}}\" class=\"result\">\n         {{#each attributes}}\n         <table>\n            <tbody>\n               <tr>\n                  <td class=\"key\">{{key}}</td>\n                  <td class=\"value\">{{{value}}}</td>\n               </tr>\n            </tbody>\n         </table>\n         {{/each}}\n      </div>\n      {{/each}}\n   </div>\n   <div class=\"page\">\n      <span class=\"total\">{{total}} resultados.</span>\n   </div>\n</div>";
