<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test plugin</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: sans-serif;
        }
        body {
            display: flex;
            flex-direction: column;
        }
        #gallery-plugin-line-bar {
            box-sizing: border-box;
            flex: 0 0 auto;
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.5rem 0.75rem;
            padding: 0.5rem 1rem;
            background: #f6f8fa;
            border-bottom: 1px solid #e1e4e8;
        }
        #gallery-plugin-line-bar label {
            margin: 0;
        }
        #gallery-plugin-line-bar select {
            min-width: 10rem;
        }
        #galleryPluginLineHint {
            flex: 1 1 auto;
        }
        #gallery-test-frame {
            display: block;
            flex: 1 1 auto;
            width: 100%;
            min-height: 0;
            height: auto;
            border: 0;
        }
    </style>
    <script src="../../configuration/config.js"></script>
    <script src="../../configuration/gallery-plugin-line.js"></script>
</head>
<body>
    <div id="gallery-plugin-line-bar">
        <label for="galleryPluginLineSelect"><strong>Entorno:</strong></label>
        <select id="galleryPluginLineSelect" class="form-control form-control-sm"></select>
        <label for="galleryApiVersionSelect"><strong>Versión:</strong></label>
        <select id="galleryApiVersionSelect" class="form-control form-control-sm"></select>
        <span id="galleryPluginLineHint" class="text-muted small"></span>
    </div>
    <iframe id="gallery-test-frame" title="Test del plugin" scrolling="no"></iframe>
    <script>
        (function () {
            var select = document.getElementById('galleryPluginLineSelect');
            var versionSelect = document.getElementById('galleryApiVersionSelect');
            var frame = document.getElementById('gallery-test-frame');
            var hint = document.getElementById('galleryPluginLineHint');

            function updateHint(envId, apiVersion) {
                hint.textContent = getGalleryEnvironmentHint(envId, apiVersion);
            }

            function syncVersionSelect(envId) {
                fillGalleryApiVersionSelect(versionSelect, envId);
                var apiVersion = getGalleryApiVersion(envId);
                if (apiVersion) {
                    versionSelect.value = apiVersion;
                }
                return versionSelect.value || apiVersion;
            }

            function loadFrame() {
                var envId = select.value;
                var apiVersion = versionSelect.value || getGalleryApiVersion(envId);
                setGalleryEnvironment(envId);
                setGalleryApiVersion(apiVersion, envId);
                updateHint(envId, apiVersion);
                var params = new URLSearchParams(window.location.search);
                params.set(GALLERY_ENV_PARAM, envId);
                if (apiVersion) {
                    params.set(GALLERY_API_VERSION_PARAM, apiVersion);
                } else {
                    params.delete(GALLERY_API_VERSION_PARAM);
                }
                params.delete(GALLERY_PLUGIN_LINE_PARAM);
                var target = getGalleryPluginTestTarget(envId, apiVersion);
                frame.src = target + '?' + params.toString();
                var url = new URL(window.location.href);
                url.searchParams.set(GALLERY_ENV_PARAM, envId);
                if (apiVersion) {
                    url.searchParams.set(GALLERY_API_VERSION_PARAM, apiVersion);
                } else {
                    url.searchParams.delete(GALLERY_API_VERSION_PARAM);
                }
                url.searchParams.delete(GALLERY_PLUGIN_LINE_PARAM);
                window.history.replaceState({}, '', url.pathname + url.search);
            }

            function boot() {
                fillGalleryEnvironmentSelect(select);
                var envId = getGalleryEnvironmentId();
                select.value = envId;
                syncVersionSelect(envId);
                select.addEventListener('change', function () {
                    var nextEnv = select.value;
                    setGalleryEnvironment(nextEnv);
                    syncVersionSelect(nextEnv);
                    loadFrame();
                });
                versionSelect.addEventListener('change', loadFrame);
                loadFrame();
            }

            ensureGalleryApiConfigLoaded().then(boot);
        })();
    </script>
</body>
</html>
