<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="idee" content="yes">
    <title>Archetype</title>
    <script type="text/javascript" src="../../configuration/config.js"></script>
    <script type="text/javascript">
        document.write(`<link href="${IDEE_DOMAIN}/assets/css/apiidee${IDEE_VERSION_SUFFIX}.ol.min.css" rel="stylesheet" />`);
    </script>
    <link href="../../plugins/archetype/dist/archetype.ol.min.css" rel="stylesheet" />
    <script type="text/javascript">document.write(`<link href="${IDEE_DOMAIN}/plugins/help/help.ol.min.css" rel="stylesheet" />`);</script>
    <script type="text/javascript">
        document.write(`<link href="${IDEE_DOMAIN}/plugins/sharemap/sharemap.ol.min.css" rel="stylesheet" />`);
    </script>
    <style rel="stylesheet">
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: auto;
        }
    </style>
</head>

<body>
    <div class="m-api-idee-test-form-frame">
        <div class="m-test-form">
            <div>
                <label for="selectPosicion" title="Posición del plugin sobre el mapa">Posición del plugin "position"</label>
                <select name="position" id="selectPosicion">
                    <option value="left">Izquierda</option>
                    <option value="right" selected="selected">Derecha</option>
                </select>
            </div>
            <div>
                <label for="selectCollapsed"
                    title="Indica si el plugin aparece colapsado al inicio (true/false). Por defecto: true">Colapsado al inicio "collapsed"</label>
                <select name="collapsed" id="selectCollapsed">
                    <option value="true" selected="selected">true</option>
                    <option value="false">false</option>
                </select>
            </div>
            <div>
                <label for="inputOrder"
                    title="Define en qué posición del panel debe aparecer en el conjunto de controles o plugins">Orden entre controles / plugins "order"</label>
                <input type="number" name="order" id="inputOrder" value="0">
            </div>
            <div>
                <label for="inputTooltip"
                    title="Texto que se muestra al pasar el ratón sobre el botón del plugin.">Título de la herramienta "tooltip"</label>
                <input type="text" name="tooltip" id="inputTooltip" list="tooltipSug" value="Plugin plantilla">
                <datalist id="tooltipSug">
                    <option value="Plugin plantilla"></option>
                </datalist>
            </div>
        </div>
        <div class="m-test-buttons">
            <button name="eliminar" class="m-test-button" id="botonEliminar">Eliminar Plugin</button>
        </div>
    </div>
    <div id="mapjs" class="m-container"></div>
    <script type="text/javascript">
        document.write(`<script src="${IDEE_DOMAIN}/vendor/browser-polyfill.js"><\/script>`);
        document.write(`<script src="${IDEE_DOMAIN}/js/apiidee${IDEE_VERSION_SUFFIX}.ol.min.js"><\/script>`);
        document.write(`<script src="${IDEE_DOMAIN}/js/configuration${IDEE_VERSION_SUFFIX}.js"><\/script>`);
        document.write(`<script src="${IDEE_DOMAIN}/plugins/sharemap/sharemap.ol.min.js"><\/script>`);
    </script>
    <script type="text/javascript" src="../../plugins/archetype/dist/archetype.ol.min.js"></script>
    <script type="text/javascript">document.write(`<script src="${IDEE_DOMAIN}/plugins/help/help.ol.min.js"><\/script>`);</script></script>
    <script type="text/javascript">
        const urlParams = new URLSearchParams(window.location.search);
        IDEE.language.setLang(urlParams.get('language') || 'es');

        const map = IDEE.map({
            container: 'mapjs',
        });

        let myPlugin;

        const selectPosicion = document.getElementById('selectPosicion');
        const selectCollapsed = document.getElementById('selectCollapsed');
        const inputOrder = document.getElementById('inputOrder');
        const inputTooltip = document.getElementById('inputTooltip');

        selectPosicion.addEventListener('change', cambiarTest);
        selectCollapsed.addEventListener('change', cambiarTest);
        inputOrder.addEventListener('change', cambiarTest);
        inputTooltip.addEventListener('change', cambiarTest);

        function cambiarTest() {
            const props = {
                position: selectPosicion.options[selectPosicion.selectedIndex].value,
                collapsed: (selectCollapsed.options[selectCollapsed.selectedIndex].value === 'true'),
                tooltip: inputTooltip.value,
            };

            if (inputOrder.value !== '') {
                props.order = parseInt(inputOrder.value, 10);
            }

            if (myPlugin) {
                map.removePlugins(myPlugin);
            }
            crearPlugin(props);
        }

        function crearPlugin(propiedades) {
            myPlugin = new IDEE.plugin.Archetype(propiedades);
            map.addPlugin(myPlugin);
        }

        cambiarTest();

        let mp2 = new IDEE.plugin.ShareMap({
            baseUrl: IDEE_DOMAIN,
            urlAPI: true,
            position: 'TR',
        });
        map.addPlugin(mp2);
        map.addPlugin(new IDEE.plugin.Help({}));

        const botonEliminar = document.getElementById('botonEliminar');
        botonEliminar.addEventListener('click', function () {
            map.removePlugins(myPlugin);
        });
    </script>
</body>
<!-- Global site tag (gtag.js) - Google Analytics -->
<script type="text/javascript">
	document.write(`<script async src="https://www.googletagmanager.com/gtag/js?id=${GOOGLE_ANALYTICS_ID}"><\/script>`);
</script>

<script type="text/javascript"
	src="../../configuration/google_analytics_content.js"></script>

</html>
