<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <meta http-equiv="X-UA-ComyPluginatible" content="IE=edge" />
    <meta name="idee" content="yes">
    <title>Printerdos</title>
    <script type="text/javascript" src="../../configuration/config.js"></script>
    <script type="text/javascript">
        document.write(`<link href="${IDEE_DOMAIN}/assets/css/apiidee.ol.min.css" rel="stylesheet" />`);
    </script>
    <link href="../../plugins/printerdos/dist/printerdos.ol.min.css" rel="stylesheet" />
    <script type="text/javascript">
        document.write(`<link href="${IDEE_DOMAIN}/plugins/sharemap/sharemap.ol.min.css" rel="stylesheet" />`);
    </script>
    <style rel="stylesheet">
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: auto;
        }
    </style>
</head>
<body>
    <div>
        <label for="inputUrl">Parámetro url</label>
        <input type="text" id="inputUrl" value="https://geoprint-sigc.juntadeandalucia.es/geoprint3/print/SIGC" />
        <label for="inputParams">Parámetro params</label>
        <input type="text" id="inputParams" value="{
            urlApplication: 'https://geoprint-sigc.juntadeandalucia.es/geoprint3',
            layout: {
              outputFilename: 'impresion_${yyyy-MM-dd_hhmmss}',
            },
            parameters: {
              imagenCoordenadas: 'file://windrose.png',
              imagenAndalucia: 'file://logo_JA.png',
            }
          }" />
        <label for="inputOptions">Parámetro options</label>
        <input type="text" id="inputOptions" value="{
            legend: true,
            dpi: 300,
            layout: 'A4 landscape (SIGC)',
            format: 'png',
            conflictResolution: true,  // Solo una vez, elige el valor que necesites
            goodnessOfFit: 0.5,
            allowOverruns: false,
            autoWrap: 400,
            followLine: true,
            group: false,
            maxDisplacement: 400,
            spaceAround: 50
          }" />
        <input type="button" value="Eliminar Plugin" name="eliminar" id="botonEliminar">
    </div>
    <div id="mapjs" class="container"></div>
    <script type="text/javascript">
        document.write(`<script src="${IDEE_DOMAIN}/vendor/browser-polyfill.js"><\/script>`);
        document.write(`<script src="${IDEE_DOMAIN}/js/apiidee.ol.min.js"><\/script>`);
        document.write(`<script src="${IDEE_DOMAIN}/js/configuration.js"><\/script>`);
        document.write(`<script src="${IDEE_DOMAIN}/plugins/sharemap/sharemap.ol.min.js"><\/script>`);
    </script>
    <script type="text/javascript" src="../../plugins/printerdos/dist/printerdos.ol.min.js"></script>

    <script type="text/javascript">
        const urlParams = new URLSearchParams(window.location.search);
        IDEE.language.setLang(urlParams.get('language') || 'es');

        const map = IDEE.map({
            container: 'mapjs',
            wmcfiles: ['https://componentes.idee.es/estaticos/Datos/WMC/mapa.xml'],
            projection: 'EPSG:25830',
        });

        let mp;
        let url, parameters, options;
        const inputUrl = document.getElementById("inputUrl");
        const inputParams = document.getElementById("inputParams");
        const inputOptions = document.getElementById("inputOptions");

        inputUrl.addEventListener('change', cambiarTest);
        inputParams.addEventListener('change', cambiarTest);
        inputOptions.addEventListener('change', cambiarTest);
        cambiarTest();

        function cambiarTest() {
            url = inputUrl.value;
            parameters = JSON.parse(inputParams.value);
            options = JSON.parse(inputOptions.value);
            
            if (mp) map.removePlugins(mp);
            crearPlugin(url, parameters, options);
        }

        function crearPlugin(url, parameters, options) {
            mp = new IDEE.plugin.Printer({
              url: url,
              params: parameters,
              options: options,
            });

            map.addPlugin(mp);
        }

        let mp2 = new IDEE.plugin.ShareMap({
            baseUrl: IDEE_DOMAIN,
            urlAPI: true,
            position: "TR",
        });
        map.addPlugin(mp2);
        
        const botonEliminar = document.getElementById("botonEliminar");
        botonEliminar.addEventListener("click", function() {
            map.removePlugins(mp);
        });
    </script>
</body>

<!-- Global site tag (gtag.js) - Google Analytics -->
<script type="text/javascript">
	document.write(`<script async src="https://www.googletagmanager.com/gtag/js?id=${GOOGLE_ANALYTICS_ID}"><\/script>`);
</script>

<script type="text/javascript"
	src="../../configuration/google_analytics_content.js"></script>

</html>
