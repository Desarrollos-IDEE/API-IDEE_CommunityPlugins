<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <meta http-equiv="X-UA-ComyPluginatible" content="IE=edge" />
    <meta name="idee" content="yes">
    <title>Searchpanel</title>
    <script type="text/javascript" src="../../configuration/config.js"></script>
    <script type="text/javascript">
        document.write(`<link href="${IDEE_DOMAIN}/assets/css/apiidee.ol.min.css" rel="stylesheet" />`);
    </script>
    <link href="../../plugins/searchpanel/dist/searchpanel.ol.min.css" rel="stylesheet" />
    <script type="text/javascript">
        document.write(`<link href="${IDEE_DOMAIN}/plugins/sharemap/sharemap.ol.min.css" rel="stylesheet" />`);
    </script>
    <style rel="stylesheet">
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: auto;
        }
    </style>
</head>

<body>
    <div>
        <!-- LISTADO DE PARÁMETROS DEL PLUGIN -->
		<label for="inputOptions">Parámetro options</label>
        <input type="text" name="options" id="inputOptions" value='{"position": "TR"}'>

        <label for="inputConfig">Parámetro config</label>
        <textarea name="config" id="inputConfig" rows="5" cols="20">{
  "title": "Buscador de Espacios Productivos",
  "geosearchUrl": "https://www.juntadeandalucia.es/institutodeestadisticaycartografia/geobusquedas/eepp-f1/search?",
  "maxResults": 100,
  "fields": [
    {"field": "municipio", "alias": "Municipio", "label": "Escribe el nombre del Municipio"},
    {"field": "provincia", "alias": "Provincia", "label": "Escribe el nombre de la Provincia"},
    {"field": "nombre", "alias": "Nombre", "label": "Escribe el nombre del Espacio Productivo"}
  ],
  "infoFields": [
    {"field": "nombre", "alias": "Nombre "},
    {"field": "tipologia", "alias": "Tipología"},
    {"field": "municipio", "alias": "Municipio"},
    {"field": "provincia", "alias": "Provincia"}
  ]
}</textarea>
		<input type="button" value="Eliminar Plugin" name="eliminar" id="botonEliminar">
	</div>
    <div id="mapjs" class="container"></div>
    <script type="text/javascript">
        document.write(`<script src="${IDEE_DOMAIN}/vendor/browser-polyfill.js"><\/script>`);
        document.write(`<script src="${IDEE_DOMAIN}/js/apiidee.ol.min.js"><\/script>`);
        document.write(`<script src="${IDEE_DOMAIN}/js/configuration.js"><\/script>`);
        document.write(`<script src="${IDEE_DOMAIN}/plugins/sharemap/sharemap.ol.min.js"><\/script>`);
    </script>
    <script type="text/javascript" src="../../plugins/searchpanel/dist/searchpanel.ol.min.js"></script>
    <script type="text/javascript">
        // PERMITE OBTENER EL LENGUAJE ESPECIFICADO EN LA URL
        const urlParams = new URLSearchParams(window.location.search);
        IDEE.language.setLang(urlParams.get('language') || 'es');

        IDEE.config.PROXY_URL = 'https://mapea4-sigc.juntadeandalucia.es/mapea/api/proxy';
        IDEE.config.PROXY_POST_URL = 'https://mapea4-sigc.juntadeandalucia.es/mapea/proxyPost';
        IDEE.proxy(true);

        const map = IDEE.map({
            container: 'mapjs',
        });

        // VARIABLES PARA ALMACENAR EL PLUGIN Y LAS PROPIEDADES
        let myPlugin, config, options;

        const inputConfig = document.getElementById("inputConfig");
        const inputOptions = document.getElementById("inputOptions");

        // EVENTOS PARA CAMBIAR EL TEST
        inputConfig.addEventListener('change', cambiarTest);
        inputOptions.addEventListener('change', cambiarTest);
        function cambiarTest() {
            let objeto = {}
            objeto.config = JSON.parse(inputConfig.value);
            objeto.options = JSON.parse(inputOptions.value);
            if (myPlugin) map.removePlugins(myPlugin);
            crearPlugin(objeto);
        }

        function crearPlugin(propiedades) {
            myPlugin = new IDEE.plugin.Searchpanel(propiedades);
            map.addPlugin(myPlugin);
        }

        // CREA EL PLUGIN CON LAS PROPIEDADES POR DEFECTO
        cambiarTest();

        let mp2 = new IDEE.plugin.ShareMap({
            baseUrl: IDEE_DOMAIN,
            urlAPI: true,
            position: "TR",
        });
        map.addPlugin(mp2);

        // EVENTO PARA ELIMINAR EL PLUGIN
        const botonEliminar = document.getElementById("botonEliminar");
        botonEliminar.addEventListener("click", function() {
            map.removePlugins(myPlugin);
        });
    </script>
</body>
<!-- Global site tag (gtag.js) - Google Analytics -->
<script type="text/javascript">
	document.write(`<script async src="https://www.googletagmanager.com/gtag/js?id=${GOOGLE_ANALYTICS_ID}"><\/script>`);
</script>

<script type="text/javascript"
	src="../../configuration/google_analytics_content.js"></script>

</html>
