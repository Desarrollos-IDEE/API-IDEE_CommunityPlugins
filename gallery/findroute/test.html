<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <meta http-equiv="X-UA-ComyPluginatible" content="IE=edge" />
    <meta name="idee" content="yes">
    <title>Findroute</title>
    <script type="text/javascript" src="../../configuration/config.js"></script>
    <script type="text/javascript">
        document.write(`<link href="${IDEE_DOMAIN}/assets/css/apiidee.ol.min.css" rel="stylesheet" />`);
    </script>
    <link href="../../plugins/findroute/dist/findroute.ol.min.css" rel="stylesheet" />
    <style rel="stylesheet">
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: auto;
        }
    </style>
</head>

<body>
    <div>
        <label for="selectPosicion">Selector de posición del plugin</label> 
        <select name="position" id="selectPosicion">
        <option value="TL">Arriba Izquierda (TL)</option>
        <option value="TR" selected="selected">Arriba Derecha (TR)</option>
        <option value="BR">Abajo Derecha (BR)</option>
        <option value="BL">Abajo Izquierda (BL)</option>
        </select> 
		<label for="inputOsrmurl">Parámetro osrmurl</label>
        <input type="text" name="osrmurl" id="inputOsrmurl" list="osrmurlSug" value="">
        <datalist id="osrmurlSug">
            <option value=""></option>
        </datalist>
        <input type="text" name="osrmurlAlternativa" id="inputOsrmurlAlternativa" list="osrmurlAlternativaSug" value="">
        <datalist id="osrmurlAlternativaSug">
            <option value="https://router.project-osrm.org"></option>
        </datalist>
        <input type="text" name="conflictedPlugins" id="inputConflictedPlugins" list="conflictedPluginsSug" value="navigation, tools, panelSelectByPolygon">
        <datalist id="conflictedPluginsSug">
            <option value="navigation, tools, panelSelectByPolygon"></option>
        </datalist>
        <label for="inputUrlGeocoderInverso">Parámetro urlGeocoderInverso</label>
        <input type="text" name="urlGeocoderInverso" id="inputUrlGeocoderInverso" list="urlGeocoderInversoSug" value="http://ws248.juntadeandalucia.es/EXT_PUB_CallejeroREST/geocoderInversoSrs">
        <datalist id="urlGeocoderInversoSug">
            <option value="http://ws248.juntadeandalucia.es/EXT_PUB_CallejeroREST/geocoderInversoSrs"></option>
        </datalist>
        <label for="inputSearchstreetUrl">Parámetro searchstreetUrl</label>
        <input type="text" name="searchstreetUrl" id="inputSearchstreetUrl" list="searchstreetUrlSug" value="https://ws248.juntadeandalucia.es/EXT_PUB_CallejeroREST/geocoderMunProvSrs">
        <datalist id="searchstreetUrlSug">
            <option value="https://ws248.juntadeandalucia.es/EXT_PUB_CallejeroREST/geocoderMunProvSrs"></option>
        </datalist>
        <label for="inputSearchstreetNormalizar">Parámetro searchstreetNormalizar</label>
        <input type="text" name="searchstreetNormalizar" id="inputSearchstreetNormalizar" list="searchstreetNormalizarSug" value="https://ws248.juntadeandalucia.es/EXT_PUB_CallejeroREST/normalizar">
        <datalist id="searchstreetNormalizarSug">
            <option value="https://ws248.juntadeandalucia.es/EXT_PUB_CallejeroREST/normalizar"></option>
        </datalist>
		<input type="button" value="Eliminar Plugin" name="eliminar" id="botonEliminar">
	</div>
    <div id="mapjs" class="container"></div>
    <script type="text/javascript">
        document.write(`<script src="${IDEE_DOMAIN}/vendor/browser-polyfill.js"><\/script>`);
        document.write(`<script src="${IDEE_DOMAIN}/js/apiidee.ol.min.js"><\/script>`);
        document.write(`<script src="${IDEE_DOMAIN}/js/configuration.js"><\/script>`);
    </script>
    <script type="text/javascript" src="../../plugins/findroute/dist/findroute.ol.min.js"></script>
    <script type="text/javascript">
        // PERMITE OBTENER EL LENGUAJE ESPECIFICADO EN LA URL
        const urlParams = new URLSearchParams(window.location.search);
        IDEE.language.setLang(urlParams.get('language') || 'es');

        IDEE.config.PROXY_URL = 'https://mapea4-sigc.juntadeandalucia.es/mapea/api/proxy';
        IDEE.config.PROXY_POST_URL = 'https://mapea4-sigc.juntadeandalucia.es/mapea/proxyPost';

        const map = IDEE.map({
            container: 'mapjs',
        });

        // VARIABLES PARA ALMACENAR EL PLUGIN Y LAS PROPIEDADES
        let myPlugin, panel, osrmurl, osrmurlAlternativa, conflictedPlugins, urlGeocoderInverso, searchstreetUrl, searchstreetNormalizar;

        const selectPanel = document.getElementById("selectPosicion");
        const inputOsrmurl = document.getElementById("inputOsrmurl");
        const inputOsrmurlAlternativa = document.getElementById("inputOsrmurlAlternativa");
        const inputConflictedPlugins = document.getElementById("inputConflictedPlugins");
        const inputUrlGeocoderInverso = document.getElementById("inputUrlGeocoderInverso");
        const inputSearchstreetUrl = document.getElementById("inputSearchstreetUrl");
        const inputSearchstreetNormalizar = document.getElementById("inputSearchstreetNormalizar");

        // EVENTOS PARA CAMBIAR EL TEST
        selectPanel.addEventListener('change', cambiarTest);
        inputOsrmurl.addEventListener('change', cambiarTest);
        inputOsrmurlAlternativa.addEventListener('change', cambiarTest);
        inputConflictedPlugins.addEventListener('change', cambiarTest);
        inputUrlGeocoderInverso.addEventListener('change', cambiarTest);
        inputSearchstreetUrl.addEventListener('change', cambiarTest);
        inputSearchstreetNormalizar.addEventListener('change', cambiarTest);

        function cambiarTest() {
            let objeto = {}
            objeto.panel = { position: selectPanel.options[selectPanel.selectedIndex].value };
            objeto.osrmurl = inputOsrmurl.value != "" ? objeto.osrmurl = inputOsrmurl.value : "";
            objeto.osrmurlAlternativa = inputOsrmurlAlternativa.value != "" ? objeto.osrmurlAlternativa = inputOsrmurlAlternativa.value : "";
            objeto.conflictedPlugins = inputConflictedPlugins.value != "" ? objeto.conflictedPlugins = inputConflictedPlugins.value : "";
            objeto.urlGeocoderInverso = inputUrlGeocoderInverso.value != "" ? objeto.urlGeocoderInverso = inputUrlGeocoderInverso.value : "";
            objeto.searchstreetUrl = inputSearchstreetUrl.value != "" ? objeto.searchstreetUrl = inputSearchstreetUrl.value : "";
            objeto.searchstreetNormalizar = inputSearchstreetNormalizar.value != "" ? objeto.searchstreetNormalizar = inputSearchstreetNormalizar.value : "";
            if (myPlugin) map.removePlugins(myPlugin);
            crearPlugin(objeto);
        }

        function crearPlugin(propiedades) {
            myPlugin = new IDEE.plugin.Findroute(propiedades);
            map.addPlugin(myPlugin);
        }

        // CREA EL PLUGIN CON LAS PROPIEDADES POR DEFECTO
        cambiarTest();

        // EVENTO PARA ELIMINAR EL PLUGIN
        const botonEliminar = document.getElementById("botonEliminar");
        botonEliminar.addEventListener("click", function() {
            map.removePlugins(myPlugin);
        });
    </script>
</body>

</script>

	src="../../configuration/google_analytics_content.js"></script>
