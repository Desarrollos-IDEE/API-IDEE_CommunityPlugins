<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <meta http-equiv="X-UA-ComyPluginatible" content="IE=edge" />
    <meta name="idee" content="yes">
    <title>CatalogSearch</title>
    <script type="text/javascript" src="../../configuration/config.js"></script>
    <script type="text/javascript">
        document.write(`<link href="${IDEE_DOMAIN}/assets/css/apiidee.ol.min.css" rel="stylesheet" />`);
    </script>
    <link href="../../plugins/catalogsearch/dist/catalogsearch.ol.min.css" rel="stylesheet" />
    <script type="text/javascript">
        document.write(`<link href="${IDEE_DOMAIN}/plugins/sharemap/sharemap.ol.min.css" rel="stylesheet" />`);
    </script>
    <style rel="stylesheet">
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: auto;
        }
    </style>
</head>

<body>
    <div>
        <!-- LISTADO DE PARÁMETROS DEL PLUGIN -->
		<label for="selectCollapsible">Selector collapsible</label> <select
			name="httpValue" id="selectCollapsible">
			<option value=true>true</option>
			<option value=false>false</option>
		</select> 
        <label for="inputGeonetworkURL">Parámetro geoNetworkUrl</label>
        <input type="text" name="geonetworkurl" id="inputGeonetworkurl" list="geonetworkurlSug" value="http://www.ideandalucia.es/catalogo/inspire/srv/spa">
        <datalist id="geonetworkurlSug">
            <option value="http://www.ideandalucia.es/catalogo/inspire/srv/spa"></option>
        </datalist>
        <label for="inputClassname">Parámetro classname</label>
        <input type="text" name="classname" id="inputClassname" list="classnameSug" value="m-catalogsearch">
        <datalist id="classnameSug">
            <option value="m-catalogsearch"></option>
        </datalist>
		<input type="button" value="Eliminar Plugin" name="eliminar" id="botonEliminar">
	</div>
    <div id="mapjs" class="container"></div>
    <script type="text/javascript">
        document.write(`<script src="${IDEE_DOMAIN}/vendor/browser-polyfill.js"><\/script>`);
        document.write(`<script src="${IDEE_DOMAIN}/js/apiidee.ol.min.js"><\/script>`);
        document.write(`<script src="${IDEE_DOMAIN}/js/configuration.js"><\/script>`);
        document.write(`<script src="${IDEE_DOMAIN}/plugins/sharemap/sharemap.ol.min.js"><\/script>`);
    </script>
    <script type="text/javascript" src="../../plugins/catalogsearch/dist/catalogsearch.ol.min.js"></script>
    <script type="text/javascript">
        IDEE.config.PROXY_URL = 'https://mapea4-sigc.juntadeandalucia.es/mapea/api/proxy';
        IDEE.config.PROXY_POST_URL = 'https://mapea4-sigc.juntadeandalucia.es/mapea/proxyPost';
        IDEE.proxy(true);

        // PERMITE OBTENER EL LENGUAJE ESPECIFICADO EN LA URL
        const urlParams = new URLSearchParams(window.location.search);
        IDEE.language.setLang(urlParams.get('language') || 'es');

        const map = IDEE.map({
            container: 'mapjs',
        });

        // VARIABLES PARA ALMACENAR EL PLUGIN Y LAS PROPIEDADES
        let myPlugin, collapsible, geonetworkurl, classname;

        const selectCollapsible = document.getElementById("selectCollapsible");
        const inputGeonetworkURL = document.getElementById("inputGeonetworkurl");
        const inputClassname = document.getElementById("inputClassname");

        // EVENTOS PARA CAMBIAR EL TEST
        selectCollapsible.addEventListener('change', cambiarTest);
		inputGeonetworkURL.addEventListener('change', cambiarTest);
        inputClassname.addEventListener('change', cambiarTest);

        function cambiarTest() {
            let objeto = {}
            objeto.collapsible = (selectCollapsible.options[selectCollapsible.selectedIndex].value === 'true');
			objeto.geoNetworkUrl = inputGeonetworkURL.value != "" ? objeto.geoNetworkUrl = inputGeonetworkURL.value : "";
            objeto.classname = inputClassname.value != "" ? objeto.classname = inputClassname.value : "";
            if (myPlugin) map.removePlugins(myPlugin);
            crearPlugin(objeto);
        }

        function crearPlugin(propiedades) {
            myPlugin = new IDEE.plugin.CatalogSearch(propiedades);
            map.addPlugin(myPlugin);
        }

        // CREA EL PLUGIN CON LAS PROPIEDADES POR DEFECTO
        cambiarTest();

        let mp2 = new IDEE.plugin.ShareMap({
            baseUrl: IDEE_DOMAIN,
            urlAPI: true,
            position: "TR",
        });
        map.addPlugin(mp2);

        // EVENTO PARA ELIMINAR EL PLUGIN
        const botonEliminar = document.getElementById("botonEliminar");
        botonEliminar.addEventListener("click", function() {
            map.removePlugins(myPlugin);
        });
    </script>
</body>
<!-- Global site tag (gtag.js) - Google Analytics -->
<script type="text/javascript">
	document.write(`<script async src="https://www.googletagmanager.com/gtag/js?id=${GOOGLE_ANALYTICS_ID}"><\/script>`);
</script>

<script type="text/javascript"
	src="../../configuration/google_analytics_content.js"></script>

</html>
